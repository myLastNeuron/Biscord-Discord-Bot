name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `scripts/ensure-deps.js` runs on postinstall and downloads the ffmpeg /
# yt-dlp binaries for the current platform. That is unnecessary for lint and
# unit tests, and it makes CI slower and dependent on the network — so we
# short-circuit it with SKIP_BOOTSTRAP (see README "Configuration").
env:
  SKIP_BOOTSTRAP: '1'

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
